<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Hero Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Marvel Hero Cards</h1>
      <p>Discover your favorite superheroes</p>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <input type="text" id="hero-search" placeholder="Search for a hero..." />
      <button id="search-btn">Search</button>
    </section>

    <!-- Hero Card -->
    <section class="card-section">
      <div id="hero-card" class="hero-card hidden">
        <img id="hero-image" src="" alt="Hero Image" />

        <div class="hero-info">
          <h2 id="hero-name">Hero Name</h2>
          <p id="hero-fullname">Full Name</p>
          <p id="hero-publisher">Publisher</p>

          <!-- Power Stats -->
        </div>
      </div>
    </section>
  </body>
</html>
